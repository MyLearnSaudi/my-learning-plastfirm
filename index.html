<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLearnSaudi | منصتي التعليمية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#172033,#315bea);
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 5px 25px #0002;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:10px;
  align-items:center;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

.nav-btn{
  background:#ffffff20;
  color:white;
}

.primary{
  background:#315bea;
  color:white;
}

.danger{
  background:#ef4444;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.hero{
  min-height:470px;
  padding:70px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
  background:linear-gradient(135deg,#eef3ff,#ffffff);
}

.hero-text{
  max-width:650px;
}

.hero h1{
  font-size:48px;
  margin-bottom:20px;
}

.hero h1 span{
  color:#315bea;
}

.hero p{
  font-size:20px;
  line-height:1.8;
  color:#58657a;
  margin-bottom:25px;
}

.book{
  width:240px;
  height:300px;
  background:linear-gradient(135deg,#315bea,#7c3aed);
  border-radius:15px 30px 30px 15px;
  box-shadow:25px 30px 50px #17203355;
  transform:rotateY(-20deg) rotateX(8deg) rotateZ(3deg);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:30px;
  font-weight:bold;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:rotateY(-20deg) rotateX(8deg) translateY(0)}
  50%{transform:rotateY(-20deg) rotateX(8deg) translateY(-15px)}
}

section{
  padding:60px 6%;
}

.section-title{
  text-align:center;
  font-size:32px;
  margin-bottom:35px;
}

.search{
  width:100%;
  max-width:700px;
  display:block;
  margin:0 auto 35px;
  padding:17px 20px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:17px;
  outline:none;
}

.courses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:22px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 30px #17203312;
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:0 20px 40px #17203320;
}

.card-icon{
  font-size:45px;
  margin-bottom:15px;
}

.card h3{
  font-size:22px;
  margin-bottom:10px;
}

.card p{
  color:#687386;
  line-height:1.7;
  margin-bottom:18px;
}

.empty{
  text-align:center;
  padding:50px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:30px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.close{
  background:#eee;
  font-size:20px;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.admin{
  display:none;
  padding:40px 6%;
  background:#eef2ff;
  min-height:500px;
}

.admin-box{
  max-width:1000px;
  margin:auto;
}

.admin-top{
  background:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.admin-list{
  display:grid;
  gap:15px;
}

.admin-item{
  background:white;
  padding:20px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.actions{
  display:flex;
  gap:8px;
}

.login{
  display:none;
}

footer{
  background:#172033;
  color:white;
  text-align:center;
  padding:30px;
}

@media(max-width:700px){
  .hero{
    flex-direction:column;
    text-align:center;
    padding-top:45px;
  }

  .hero h1{
    font-size:35px;
  }

  .book{
    width:190px;
    height:240px;
  }

  header{
    padding:15px 4%;
  }

  nav{
    gap:5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">📚 MyLearnSaudi</div>

  <nav>
    <button class="nav-btn" onclick="scrollToCourses()">المواد</button>
    <button class="nav-btn" onclick="showLogin()">لوحة التحكم</button>
    <button class="nav-btn" onclick="toggleLanguage()">English</button>
  </nav>
</header>

<main id="studentSite">

<section class="hero">

  <div class="hero-text">
    <h1>
      تعلم بطريقة <span>أسهل</span>
    </h1>

    <p>
      منصتك التعليمية للوصول إلى المواد والدروس والشروحات
      بطريقة منظمة وسهلة.
    </p>

    <button class="primary" onclick="scrollToCourses()">
      🚀 ابدأ التعلم
    </button>
  </div>

  <div class="book">
    📖<br>
    MyLearnSaudi
  </div>

</section>

<section id="coursesSection">

  <h2 class="section-title">
    📚 المواد التعليمية
  </h2>

  <input
    id="search"
    class="search"
    placeholder="🔎 ابحث عن مادة..."
    oninput="searchCourses()"
  >

  <div id="courses" class="courses">
    <div class="empty">
      جاري تحميل المواد...
    </div>
  </div>

</section>

</main>

<!-- تسجيل الدخول -->

<div id="loginModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>🔐 دخول لوحة التحكم</h2>

      <button class="close" onclick="closeModal('loginModal')">
        ×
      </button>
    </div>

    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email">
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input id="password" type="password">
    </div>

    <button class="primary" onclick="login()">
      دخول
    </button>

    <p id="loginMessage" style="margin-top:15px"></p>

  </div>

</div>

<!-- لوحة التحكم -->

<section id="adminPanel" class="admin">

  <div class="admin-box">

    <div class="admin-top">

      <div>
        <h2>⚙️ لوحة التحكم</h2>
        <p>تحكم كامل بالمحتوى</p>
      </div>

      <div>
        <button class="success" onclick="openAddSubject()">
          ➕ إضافة مادة
        </button>

        <button class="danger" onclick="logout()">
          تسجيل خروج
        </button>
      </div>

    </div>

    <div id="adminList" class="admin-list">
      جاري التحميل...
    </div>

  </div>

</section>

<!-- إضافة / تعديل مادة -->

<div id="subjectModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="subjectModalTitle">
        ➕ إضافة مادة
      </h2>

      <button
        class="close"
        onclick="closeModal('subjectModal')">
        ×
      </button>

    </div>

    <input type="hidden" id="subjectId">

    <div class="form-group">
      <label>اسم المادة بالعربي</label>
      <input id="nameAr" placeholder="مثال: الرياضيات">
    </div>

    <div class="form-group">
      <label>اسم المادة بالإنجليزي</label>
      <input id="nameEn" placeholder="Example: Mathematics">
    </div>

    <div class="form-group">
      <label>وصف المادة بالعربي</label>
      <textarea id="descriptionAr"></textarea>
    </div>

    <div class="form-group">
      <label>وصف المادة بالإنجليزي</label>
      <textarea id="descriptionEn"></textarea>
    </div>

    <button class="primary" onclick="saveSubject()">
      💾 حفظ المادة
    </button>

  </div>

</div>

<footer>
  <p>© 2026 MyLearnSaudi - جميع الحقوق محفوظة</p>
</footer>

<script>

/* =====================================
   إعداد Supabase
===================================== */

const SUPABASE_URL = "https://zvxcdjtmrwjtxwdydxmv.supabase.co";

const SUPABASE_KEY = "sb_publishable_2YaZJQR3S3AfXIlA52dYMg__91CLvu4";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   اللغة
===================================== */

let currentLanguage = "ar";

function toggleLanguage(){

  currentLanguage =
    currentLanguage === "ar"
      ? "en"
      : "ar";

  document.documentElement.lang =
    currentLanguage;

  document.documentElement.dir =
    currentLanguage === "ar"
      ? "rtl"
      : "ltr";

  renderCourses();
}


/* =====================================
   المواد
===================================== */

let subjects = [];

async function loadSubjects(){

  const { data, error } =
    await supabaseClient
      .from("subjects")
      .select("*")
      .order("id", { ascending:true });

  if(error){

    console.error(error);

    document.getElementById("courses").innerHTML =
      `
      <div class="empty">
        ⚠️ لم يتم الاتصال بقاعدة البيانات.
      </div>
      `;

    return;
  }

  subjects = data || [];

  renderCourses();
}


function renderCourses(){

  const container =
    document.getElementById("courses");

  if(subjects.length === 0){

    container.innerHTML =
      `
      <div class="empty">
        لا توجد مواد حالياً.
      </div>
      `;

    return;
  }

  container.innerHTML =
    subjects.map(subject => {

      const name =
        currentLanguage === "ar"
          ? subject.name_ar
          : subject.name_en;

      const description =
        currentLanguage === "ar"
          ? subject.description_ar
          : subject.description_en;

      return `
        <div class="card">

          <div class="card-icon">
            📚
          </div>

          <h3>${escapeHtml(name)}</h3>

          <p>
            ${escapeHtml(description || "")}
          </p>

          <button
            class="primary"
            onclick="openSubject(${subject.id})">
            عرض المادة
          </button>

        </div>
      `;

    }).join("");
}


/* =====================================
   البحث
===================================== */

function searchCourses(){

  const value =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const filtered =
    subjects.filter(subject => {

      return (
        subject.name_ar?.toLowerCase().includes(value) ||
        subject.name_en?.toLowerCase().includes(value)
      );

    });

  const container =
    document.getElementById("courses");

  container.innerHTML =
    filtered.map(subject => {

      const name =
        currentLanguage === "ar"
          ? subject.name_ar
          : subject.name_en;

      const description =
        currentLanguage === "ar"
          ? subject.description_ar
          : subject.description_en;

      return `
        <div class="card">

          <div class="card-icon">📚</div>

          <h3>${escapeHtml(name)}</h3>

          <p>${escapeHtml(description || "")}</p>

          <button
            class="primary"
            onclick="openSubject(${subject.id})">
            عرض المادة
          </button>

        </div>
      `;

    }).join("");
}


/* =====================================
   تسجيل الدخول
===================================== */

function showLogin(){

  document.getElementById("loginModal")
    .style.display = "flex";

}

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message.style.color = "red";
    message.textContent =
      "❌ بيانات الدخول غير صحيحة";

    return;
  }

  closeModal("loginModal");

  showAdmin();

}


/* =====================================
   لوحة التحكم
===================================== */

async function showAdmin(){

  document.getElementById("studentSite")
    .style.display = "none";

  document.getElementById("adminPanel")
    .style.display = "block";

  await loadAdminSubjects();

}


async function loadAdminSubjects(){

  const { data, error } =
    await supabaseClient
      .from("subjects")
      .select("*")
      .order("id");

  if(error){

    document.getElementById("adminList").innerHTML =
      "حدث خطأ في تحميل المواد";

    return;
  }

  const list =
    document.getElementById("adminList");

  if(!data || data.length === 0){

    list.innerHTML =
      `
      <div class="admin-item">
        لا توجد مواد. أضف أول مادة الآن.
      </div>
      `;

    return;
  }

  list.innerHTML =
    data.map(subject => {

      return `
        <div class="admin-item">

          <div>
            <strong>
              ${escapeHtml(subject.name_ar)}
            </strong>

            <p>
              ${escapeHtml(subject.name_en)}
            </p>
          </div>

          <div class="actions">

            <button
              class="primary"
              onclick="editSubject(${subject.id})">
              ✏️ تعديل
            </button>

            <button
              class="danger"
              onclick="deleteSubject(${subject.id})">
              🗑️ حذف
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =====================================
   إضافة مادة
===================================== */

function openAddSubject(){

  document.getElementById("subjectModalTitle")
    .textContent = "➕ إضافة مادة";

  document.getElementById("subjectId").value = "";

  document.getElementById("nameAr").value = "";

  document.getElementById("nameEn").value = "";

  document.getElementById("descriptionAr").value = "";

  document.getElementById("descriptionEn").value = "";

  document.getElementById("subjectModal")
    .style.display = "flex";
}


/* =====================================
   تعديل مادة
===================================== */

async function editSubject(id){

  const subject =
    subjects.find(s => s.id === id);

  let current = subject;

  if(!current){

    const { data } =
      await supabaseClient
        .from("subjects")
        .select("*")
        .eq("id", id)
        .single();

    current = data;
  }

  if(!current) return;

  document.getElementById("subjectModalTitle")
    .textContent = "✏️ تعديل المادة";

  document.getElementById("subjectId").value =
    current.id;

  document.getElementById("nameAr").value =
    current.name_ar || "";

  document.getElementById("nameEn").value =
    current.name_en || "";

  document.getElementById("descriptionAr").value =
    current.description_ar || "";

  document.getElementById("descriptionEn").value =
    current.description_en || "";

  document.getElementById("subjectModal")
    .style.display = "flex";
}


/* =====================================
   حفظ المادة
===================================== */

async function saveSubject(){

  const id =
    document.getElementById("subjectId").value;

  const name_ar =
    document.getElementById("nameAr").value.trim();

  const name_en =
    document.getElementById("nameEn").value.trim();

  const description_ar =
    document.getElementById("descriptionAr").value.trim();

  const description_en =
    document.getElementById("descriptionEn").value.trim();

  if(!name_ar || !name_en){

    alert("اكتب اسم المادة بالعربي والإنجليزي");

    return;
  }

  let result;

  if(id){

    result =
      await supabaseClient
        .from("subjects")
        .update({
          name_ar,
          name_en,
          description_ar,
          description_en
        })
        .eq("id", id);

  }else{

    result =
      await supabaseClient
        .from("subjects")
        .insert({
          name_ar,
          name_en,
          description_ar,
          description_en
        });

  }

  if(result.error){

    alert(
      "حدث خطأ: " +
      result.error.message
    );

    return;
  }

  closeModal("subjectModal");

  await loadSubjects();

  await loadAdminSubjects();

  alert("✅ تم حفظ المادة");

}


/* =====================================
   حذف مادة
===================================== */

async function deleteSubject(id){

  const ok =
    confirm(
      "هل أنت متأكد من حذف هذه المادة؟"
    );

  if(!ok) return;

  const { error } =
    await supabaseClient
      .from("subjects")
      .delete()
      .eq("id", id);

  if(error){

    alert(
      "❌ لم يتم الحذف: " +
      error.message
    );

    return;
  }

  await loadSubjects();

  await loadAdminSubjects();

  alert("✅ تم حذف المادة");

}


/* =====================================
   فتح المادة
===================================== */

function openSubject(id){

  const subject =
    subjects.find(s => s.id === id);

  if(!subject) return;

  const name =
    currentLanguage === "ar"
      ? subject.name_ar
      : subject.name_en;

  const description =
    currentLanguage === "ar"
      ? subject.description_ar
      : subject.description_en;

  alert(
    name +
    "\n\n" +
    (description || "")
  );

}


/* =====================================
   تسجيل الخروج
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel")
    .style.display = "none";

  document.getElementById("studentSite")
    .style.display = "block";

}


/* =====================================
   أدوات
===================================== */

function closeModal(id){

  document.getElementById(id)
    .style.display = "none";

}

function scrollToCourses(){

  document.getElementById("coursesSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text ?? "";

  return div.innerHTML;
}


/* =====================================
   التشغيل
===================================== */

loadSubjects();

</script>

</body>
</html>
